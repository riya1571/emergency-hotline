<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency Service Directory</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .inter-font {
        font-family: "Inter", sans-serif;
      }
      .hind-madurai-font {
        font-family: "Hind Madurai", sans-serif;
      }
    </style>
  </head>
<body>
    
</body>
</html><body class="hind-madurai-font">
    <!-- px-[60px] py-[25px] -->
    <section
      class="flex justify-between max-sm:flex-col items-center px-[60px] py-[25px]"
    >
      <div
        class="bg-[#FFFFFF] flex justify-center items-center max-sm:mb-[10px]"
      >
        <img
          class="h-[50px] w-[50px] mr-[10px]"
          src="./assets/logo.png"
          alt=""
        />
        <h1 class="text-[#006747] text-[20px] font-black">
          Emergency <br />
          Service
        </h1>
      </div>
      <div class="flex items-center justify-center">
        <div
          class="flex items-center bg-[#41ff6b1a] py-[14px] px-[35px] rounded-[50px] mr-[20px]"
        >
          <h1 id="heart-show" class="mr-[10px]">0</h1>
          <img
            class="w-[30px] max-sm:w-[20px] max-sm:h-[20px] h-[30px]"
            src="./assets/heart.png"
            alt=""
          />
        </div>
        <div
          class="mr-[20px] flex items-center bg-[#41ff6b1a] py-[14px] px-[35px] rounded-[50px]"
        >
          <h1 id="point-show" class="mr-[10px]">100</h1>
          <img class="w-[24px] h-[24px]" src="./assets/coin.png" alt="" />
        </div>
        <div
          class="flex items-center py-[14px] px-[35px] rounded-[50px] bg-[#00A63E] text-[#FFFFFF]"
        >
          <h1 id="copy-show">0</h1>
          <p class="ml-[5px]">Copy</p>
        </div>
      </div>
    </section>

    <section
      class="bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] text-white flex flex-col max-sm:text-center items-center py-[21px]"
    >
      <img class="w-[92px] h-[92px]" src="./assets/logo-dark.png" alt="" />
      <h1 class="font-bold text-[40px]">Emergency Service Directory</h1>
      <p class="font-semibold text-[20px] text-center">
        Government Emergency Services at Your Fingertip – A Project by
        Government of the People’s Republic of Bangladesh
      </p>
    </section>

    <section
      class="bg-[#F5FFF6] pl-[58px] pr-[62px] pb-[86px] pt-[48px] flex items-center justify-center"
    >
      <div class="grid grid-cols-4 max-sm:grid-cols-1 gap-[20px]">
        <div
          class="bg-white rounded-[12px] p-[32px] shadow-[0px_2px_3px_0px_rgba(0,0,0,0.15)]"
        >
          <div class="flex justify-between items-center">
            <div
              class="rounded-[20px] bg-[#FFE3E2] w-[60px] h-[60px] flex items-center text-center justify-center"
            >
              <img
                class="w-[32px] h-[32px]"
                src="./assets/emergency.png"
                alt=""
              />
            </div>
            <button>
              <i
                id="heart1"
                class="fa-regular fa-heart text-[24px] cursor-pointer"
              ></i>
            </button>
          </div>
          <h1 class="text-[24px] font-bold mt-[16px]">
            National Emergency Number
          </h1>
          <p class="font-regular text-[18px] text-[#5C5C5C]">
            National Emergency
          </p>
          <h1 class="text-[32px] font-bold mt-[24px]">999</h1>
          <button
            class="text-[#5C5C5C] text-[18px] bg-[#F2F2F2] rounded-[20px] text-center px-[16px] py-[6px]"
          >
            All
          </button>
          <div class="flex justify-between items-center mt-[24px]">
            <div
              data-copy-text="999"
              class="copy-btn text-center bg-white border border-[#D4D6D5] rounded-lg py-[11px] px-[62px] max-sm:px-[30px] hover:text-white cursor-pointer hover:bg-black"
            >
              <p class="max-sm:text-[11px]"><i class="fa-regular fa-copy"></i> Copy</p>
            </div>
            <button
              id="call-btn1"
              class="max-sm:text-[11px] py-[11px] px-[62px] max-sm:px-[30px] max-sm:ml-[10px] bg-[#00A63E] rounded-[8px] text-white hover:bg-gray-400 cursor-pointer"
            >
              <i class="fa-solid fa-phone mr-[2px] "></i>Call
            </button>
          </div>
        </div>
    
  </body>
</html>
